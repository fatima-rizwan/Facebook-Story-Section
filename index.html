<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Facebook Story </title>
    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />

</head>

<body>
    <!-- navbar -->

    <div class="navbar">
        <div class="nav-left">
            <img src="https://static.vecteezy.com/system/resources/thumbnails/042/148/655/small/facebook-logo-facebook-social-media-icon-free-png.png"
                alt="" class="logo">
            <input type="text" class="search-bar" placeholder="Search Facebook">
        </div>

        <div class="nav-center">
            <span class="material-symbols-outlined  nav-icon">
                home </span>
            <span class="material-symbols-outlined nav-icon">
                live_tv </span>
            <span class="material-symbols-outlined nav-icon">
                storefront </span>
            <span class="material-symbols-outlined nav-icon">
                group </span>
            <span class="material-symbols-outlined nav-icon">
                explore </span>
        </div>

        <div class="nav-right">
            <span class="material-symbols-outlined  circle-icon">
                add </span>
            <span class="material-symbols-outlined circle-icon">
                notifications </span>
            <span class="material-symbols-outlined circle-icon">
                chat </span>
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSe1YgCjmvcMgL60KzafqXCUwk0NYLIAhxZ4KQ-yOAAQEWi0l7fLq8tv_Jv&s=10"
                alt="profile" class="profile-pic">
        </div>
    </div>

    <!-- story section  -->

    <div class="story-section">
        <div class="story-container">

            <div class="story">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcQcXgR580WaQMLO0lJOqBCkuXlLht83axwAwGhiuDaD_yz19t9oW2JBphY&s=10"
                    alt="Story" class="story-main-img">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcS-W4SauSyockzLIiAqJOLi1YNkS0ltfJ-8h8YGirp1dg&s=10"
                    alt="profile" class="story-profile">
                <p class="story-user">Joey Tribbiani</p>
            </div>

            <div class="story">
                <img src="https://img-s1.onedio.com/id-653e76c1bab484543e8b5f66/rev-0/w-600/h-389/f-jpg/s-14fc2eb292c42e446c14a686235e0de126ff499f.jpg"
                    alt="Story" class="story-main-img">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTxZMdco4hHYj5EkJa1n7R5QJ4WGmqjA83cpcT5gMxJ2w&s=10"
                    alt="profile" class="story-profile">
                <p class="story-user">Chandler Bing</p>
            </div>

            <div class="story">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRmxdNiUrBbaU77UgR3q6JusUHtAJPK2cKFg45XT79mVFOHEVSAgOoUmZKY&s=10"
                    alt="Story" class="story-main-img">
                <img src="https://png.pngtree.com/png-vector/20240314/ourmid/pngtree-jennifer-aniston-attends-the-world-premiere-of-love-happens-at-mann-png-image_11831984.png"
                    alt="profile" class="story-profile">
                <p class="story-user">Rachel Green</p>
            </div>

            <div class="story">
                <img src="https://i.pinimg.com/236x/9e/09/d9/9e09d908cc3b951ae870fd50e8f462e1.jpg"
                    alt="Story" class="story-main-img">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcR7DM84w4nhY2upj4fxblMVBJfpiiSnKBjUx1J-oyTEeQ&s=10"
                    alt="profile" class="story-profile">
                <p class="story-user">Monica Geller</p>
            </div>

            <div class="story">
                <img src="https://i.pinimg.com/736x/e9/10/f2/e910f2b5a096535f99e806cfac578612.jpg"
                    alt="Story" class="story-main-img">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRrDUSmGF1UNzq4iGNG_SGidNYfQAo7KCFOHw0GacWpig&s=10"
                    alt="profile" class="story-profile">
                <p class="story-user">Phoebe Buffay</p>
            </div>

            <div class="story">
                <img src="https://i.pinimg.com/736x/90/26/26/9026266c5a0957afbb702b6337ce8c12.jpg"
                    alt="Story" class="story-main-img">
                <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcRlBoh03CaM2Ra2hYkjCuEt8unEZE605uocAfnKDcLr0g&s=10"
                    alt="profile" class="story-profile">
                <p class="story-user">Ross Geller</p>
            </div>

        </div>
    </div>

</body>

</html>
